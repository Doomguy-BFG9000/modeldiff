name: Bug report
description: Something in ModelDiff behaves incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal suite, config, or result file and the exact command. Remove any private data from outputs.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModelDiff version
      description: Output of `modeldiff --version`, or the commit hash.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Python version
      placeholder: Ubuntu 24.04, Python 3.12.3
    validations:
      required: true
