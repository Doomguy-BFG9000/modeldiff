name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        extras: ["dev,memory"]
        include:
          # Also test without psutil, where memory metrics are unavailable.
          - os: ubuntu-latest
            python-version: "3.12"
            extras: "dev"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest

  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Run the quickstart and check that the known regressions are reported
        run: |
          Q=examples/quickstart
          modeldiff validate $Q/suite.yaml --plugin $Q/checks.py
          modeldiff run $Q/suite.yaml -c $Q/configs/baseline.yaml -o out/baseline.json --plugin $Q/checks.py
          modeldiff run $Q/suite.yaml -c $Q/configs/candidate.yaml -o out/candidate.json --plugin $Q/checks.py
          set +e
          modeldiff compare out/baseline.json out/candidate.json --format markdown --output out/report.md
          status=$?
          set -e
          cat out/report.md
          test "$status" -eq 1
